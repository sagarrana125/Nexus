<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — My Personal Learning Zone</title>
  <meta name="description" content="Nexus is a personal learning hub — a single, calm place to jump back into every course, book, and reference worth revisiting." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============================== HEADER ============================== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Nexus.</a>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ================================ BODY ================================ -->
  <main class="site-main">

    <!-- Hero -->
    <section class="hero">
      <div class="container">
        <h1>Nexus.</h1>
        <p class="tagline">My personal learning zone</p>
        <div class="hero-rule"></div>
      </div>
    </section>

    <!-- Resources -->
    <section class="resources">
      <div class="container">
        <h2 class="section-label">Resources</h2>
        <div id="resource-grid" class="resource-grid" aria-live="polite">
          <!-- Cards are injected here by js/app.js from js/data.js -->
        </div>
      </div>
    </section>

  </main>

  <!-- ============================== FOOTER ============================== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-dot"></div>
      <p class="copyright">© 2026 Nexus</p>
      <p class="credit">designed with a minimalist, distraction‑free mind</p>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
