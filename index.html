<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — My Personal Learning Zone</title>
  <meta name="description" content="Nexus is a personal learning shelf — the handful of courses, books, and references I'm actually using right now." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <!-- ============================== HEADER ============================== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Nexus.</a>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ================================ BODY ================================ -->
  <main class="site-main">

    <!-- Hero: one typed question, then the mark. No further copy needed. -->
    <section class="hero">
      <div class="container">
        <p class="hero-line" id="hero-line"></p>
        <h1 id="hero-title">Nexus.</h1>
        <p class="tagline" id="hero-tagline">My personal learning zone</p>
      </div>
    </section>

    <!-- The Shelf -->
    <section class="shelf-section">
      <div class="container">
        <div class="shelf-label">
          <h2>The Shelf</h2>
          <span class="shelf-hint" id="shelf-hint">
            Scroll to browse
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M9 6l6 6-6 6"/>
            </svg>
          </span>
        </div>
        <div class="shelf-wrap">
          <div class="shelf" id="shelf" aria-label="Resource shelf — click a book to read more">
            <!-- Spines injected here by js/app.js from js/data.js -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ============================== FOOTER ============================== -->
  <footer class="site-footer">
    <div class="container">
      <p class="copyright">© 2026 Nexus</p>
      <p class="credit">One shelf. A few good books. Nothing else.</p>
    </div>
  </footer>

  <!-- Reading panel: opens when a book is pulled off the shelf -->
  <div class="panel-backdrop" id="panel-backdrop">
    <div class="panel" id="panel"></div>
  </div>

  <script src="js/theme.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
