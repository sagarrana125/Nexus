<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus — Learning Hub</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Vue.js 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    
    <!-- ===== CUSTOM CSS ===== -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="app">
        <!-- ===== HERO ===== -->
        <header class="hero">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1>Nexus<span>.</span></h1>
                        <p class="tagline">{{ tagline }}</p>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <span class="badge-count">Resources</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="container py-5 flex-grow-1">
            <div class="row g-4">
                <!-- Loop through resources with Vue -->
                <div 
                    class="col-lg-4 col-md-6"
                    v-for="(item, index) in resources"
                    :key="index"
                >
                    <div 
                        class="resource-card"
                        :class="{ 'card-goal': item.isGoal }"
                        @click="visitLink(item.url)"
                    >
                        <!-- SVG Icon (minimalist drawing) -->
                        <svg 
                            class="roadmap-icon" 
                            viewBox="0 0 48 48" 
                            xmlns="http://www.w3.org/2000/svg"
                            v-html="item.svg"
                        ></svg>
                        
                        <div class="step-number">{{ item.category }}</div>
                        <h3>{{ item.title }}</h3>
                        <p class="description">{{ item.description }}</p>
                        <span class="type-badge">{{ item.type }}</span>
                        <br />
                        <span class="btn-visit">Visit →</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <div class="container">
                <p class="mb-0">© 2026 Nexus</p>
            </div>
        </footer>
    </div>

    <!-- ===== CUSTOM JS ===== -->
    <script src="js/app.js"></script>
</body>
</html>
